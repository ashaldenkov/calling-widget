stages:
  - build
  - deploy

variables:
  NPM_CONFIG_LOGLEVEL: "warn"
  WIDGET_STORAGE_PREFIX: "call-widget"
  SHORT_CACHE_CONTROL: "public, max-age=300, must-revalidate"
  LONG_CACHE_CONTROL: "public, max-age=31536000, immutable"
  AWS_EC2_METADATA_DISABLED: "true"
  VAULT_ADDR: "https://vault.scalefinal.io"
  VAULT_MOUNT: "dialers"
  VAULT_AUTH_ROLE: "dialers-gitlab"
  VAULT_SECRET_PATH: "prod/_common/buckets/call-widget/terraform"

.vault_aws_credentials:
  image: $GLOBAL_CI_RUNNER
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.scalefinal.io
  before_script:
    - set -euo pipefail
    - export PYTHONUSERBASE="$CI_PROJECT_DIR/.local"
    - export PATH="$PYTHONUSERBASE/bin:$PATH"
    - pip3 install awscli --quiet --no-cache-dir --break-system-packages
    - |
      VAULT_TOKEN=$(vault write -field=token auth/jwt/login role="$VAULT_AUTH_ROLE" jwt="$VAULT_ID_TOKEN")
      : "${VAULT_TOKEN:?Vault login failed}"
      export VAULT_TOKEN
    - |
      _SECRET="${VAULT_MOUNT}/${VAULT_SECRET_PATH}"
      AWS_ACCESS_KEY_ID=$(vault kv get     -field=AWS_ACCESS_KEY_ID     "$_SECRET")
      AWS_SECRET_ACCESS_KEY=$(vault kv get -field=AWS_SECRET_ACCESS_KEY "$_SECRET")
      AWS_BUCKET_NAME=$(vault kv get       -field=AWS_BUCKET_NAME       "$_SECRET")
      AWS_REGION_FROM_VAULT=$(vault kv get -field=AWS_REGION            "$_SECRET")
      AWS_ENDPOINT_FROM_VAULT=$(vault kv get -field=AWS_ENDPOINT        "$_SECRET")
      : "${AWS_ACCESS_KEY_ID:?Vault secret missing AWS_ACCESS_KEY_ID}"
      : "${AWS_SECRET_ACCESS_KEY:?Vault secret missing AWS_SECRET_ACCESS_KEY}"
      : "${AWS_BUCKET_NAME:?Vault secret missing AWS_BUCKET_NAME}"
      export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
      export WIDGET_S3_BUCKET="${WIDGET_S3_BUCKET:-$AWS_BUCKET_NAME}"
      export AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION:-$AWS_REGION_FROM_VAULT}"
      export AWS_REGION="$AWS_DEFAULT_REGION"
      export WIDGET_S3_ENDPOINT_URL="${WIDGET_S3_ENDPOINT_URL:-$AWS_ENDPOINT_FROM_VAULT}"
      export AWS_PAGER=""

build_widget:
  stage: build
  image: node:22.21.1
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - |
      if [ -n "$WIDGET_VERSION" ]; then
        VERSION="$WIDGET_VERSION"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="$CI_COMMIT_TAG"
      else
        VERSION="$CI_COMMIT_SHORT_SHA"
      fi
      echo "WIDGET_VERSION=$VERSION" > build.env
      echo "WIDGET_STORAGE_PREFIX=${WIDGET_STORAGE_PREFIX}" >> build.env
      echo "Resolved widget version: $VERSION"
  artifacts:
    paths:
      - dist/
      - build.env
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

deploy_cdn:
  stage: deploy
  extends:
    - .vault_aws_credentials
  needs:
    - job: build_widget
      artifacts: true
  script:
    - set -euo pipefail
    - test -f dist/loader.js
    - test -f dist/call-widget.js
    - |
      aws_cli() {
        if [ -n "${WIDGET_S3_ENDPOINT_URL:-}" ]; then
          aws --endpoint-url "$WIDGET_S3_ENDPOINT_URL" "$@"
        else
          aws "$@"
        fi
      }

      BASE_PATH="s3://${WIDGET_S3_BUCKET}/${WIDGET_STORAGE_PREFIX}"
      VERSION_PATH="${BASE_PATH}/v/${WIDGET_VERSION}"

      echo "Publishing immutable version to ${VERSION_PATH}"
      aws_cli s3 cp dist/call-widget.js "${VERSION_PATH}/call-widget.js" \
        --acl public-read \
        --cache-control "${LONG_CACHE_CONTROL}" \
        --content-type "application/javascript; charset=utf-8"
      aws_cli s3 cp dist/loader.js "${VERSION_PATH}/loader.js" \
        --acl public-read \
        --cache-control "${LONG_CACHE_CONTROL}" \
        --content-type "application/javascript; charset=utf-8"

      echo "Updating latest pointers with short cache"
      aws_cli s3 cp dist/call-widget.js "${BASE_PATH}/latest/call-widget.js" \
        --acl public-read \
        --cache-control "${SHORT_CACHE_CONTROL}" \
        --content-type "application/javascript; charset=utf-8"
      aws_cli s3 cp dist/loader.js "${BASE_PATH}/loader.js" \
        --acl public-read \
        --cache-control "${SHORT_CACHE_CONTROL}" \
        --content-type "application/javascript; charset=utf-8"

      if [ -n "${WIDGET_CDN_BASE_URL:-}" ]; then
        CDN_ROOT="${WIDGET_CDN_BASE_URL%/}/${WIDGET_STORAGE_PREFIX}"
        echo "Version URL: ${CDN_ROOT}/v/${WIDGET_VERSION}/call-widget.js"
        echo "Latest URL: ${CDN_ROOT}/latest/call-widget.js"
        echo "Loader URL: ${CDN_ROOT}/loader.js"
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

list_cdn_versions:
  stage: deploy
  extends:
    - .vault_aws_credentials
  variables:
    GIT_STRATEGY: none
  script:
    - set -euo pipefail
    - |
      aws_cli() {
        if [ -n "${WIDGET_S3_ENDPOINT_URL:-}" ]; then
          aws --endpoint-url "$WIDGET_S3_ENDPOINT_URL" "$@"
        else
          aws "$@"
        fi
      }

      BASE_PATH="s3://${WIDGET_S3_BUCKET}/${WIDGET_STORAGE_PREFIX}"
      VERSIONS=$(aws_cli s3 ls "${BASE_PATH}/v/" | awk '{print $2}' | sed 's:/$::' | sort -V || true)

      if [ -z "$VERSIONS" ]; then
        echo "No versions found."
        exit 0
      fi

      echo "Available versions:"
      echo "$VERSIONS"

      if [ -n "${WIDGET_CDN_BASE_URL:-}" ]; then
        CDN_ROOT="${WIDGET_CDN_BASE_URL%/}/${WIDGET_STORAGE_PREFIX}"
        echo "Version URLs:"
        echo "$VERSIONS" | while IFS= read -r version; do
          [ -n "$version" ] || continue
          echo "${CDN_ROOT}/v/${version}/call-widget.js"
        done
        echo "Latest URL: ${CDN_ROOT}/latest/call-widget.js"
        echo "Loader URL: ${CDN_ROOT}/loader.js"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

promote_existing_version:
  stage: deploy
  extends:
    - .vault_aws_credentials
  variables:
    GIT_STRATEGY: none
  script:
    - set -euo pipefail
    - '[ -n "$SOURCE_VERSION" ] || { echo "SOURCE_VERSION is required" >&2; exit 1; }'
    - |
      aws_cli() {
        if [ -n "${WIDGET_S3_ENDPOINT_URL:-}" ]; then
          aws --endpoint-url "$WIDGET_S3_ENDPOINT_URL" "$@"
        else
          aws "$@"
        fi
      }

      BASE_PATH="s3://${WIDGET_S3_BUCKET}/${WIDGET_STORAGE_PREFIX}"
      VERSION_PATH="${BASE_PATH}/v/${SOURCE_VERSION}"

      echo "Promoting ${VERSION_PATH} to latest"
      aws_cli s3 cp "${VERSION_PATH}/call-widget.js" "${BASE_PATH}/latest/call-widget.js" \
        --acl public-read \
        --metadata-directive REPLACE \
        --cache-control "${SHORT_CACHE_CONTROL}" \
        --content-type "application/javascript; charset=utf-8"
      aws_cli s3 cp "${VERSION_PATH}/loader.js" "${BASE_PATH}/loader.js" \
        --acl public-read \
        --metadata-directive REPLACE \
        --cache-control "${SHORT_CACHE_CONTROL}" \
        --content-type "application/javascript; charset=utf-8"

      if [ -n "${WIDGET_CDN_BASE_URL:-}" ]; then
        CDN_ROOT="${WIDGET_CDN_BASE_URL%/}/${WIDGET_STORAGE_PREFIX}"
        echo "Latest URL: ${CDN_ROOT}/latest/call-widget.js"
        echo "Loader URL: ${CDN_ROOT}/loader.js"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
